# Links a zkVM-agnostic guest object against each zkVM's SDK, tests the ELFs, and optionally
# packages them with their program VKs.
#
# The caller builds the guest object in a prior job (for a Rust guest, with the
# `.github/actions/build-guest-object` action), uploads it as an artifact holding one `.a` file,
# and calls this workflow with the artifact's name:
#
#   jobs:
#     guest-object: ...                # uploads the artifact `guest-object`
#     zkvm:
#       needs: guest-object
#       uses: eth-act/ere/.github/workflows/link-guest.yml@<ref>
#       with:
#         guest-object: guest-object
#         name: stateless-validator-ethrex
#         ere-ref: <ref>                 # the same ref as in `uses:`
#         test-stateless-validator: ethrex
#         lto-args: '{"zisk": "--inline-threshold=4749 --unroll-threshold=378"}'
#         package: true
#
# Per zkVM it builds the SDK from pinned vendor sources (`sdk/build.sh`), links with `sdk/link.sh`
# (ABI check, the SDK's ISA extensions and LTO plugin, the guest's `lto-args`, `ld.lld` with full
# LTO), runs ere-guests' `zkvm_execution`
# test on the ELF, and generates the program VK with Ere's server image.
name: Link guest

on:
  workflow_call:
    inputs:
      guest-object:
        description: Name of the artifact holding the guest object (one `.a` file).
        type: string
        required: true
      name:
        description: Base name of the ELFs, e.g. `stateless-validator-ethrex`.
        type: string
        required: true
      zkvms:
        description: JSON array of the zkVMs to link for.
        type: string
        default: '["openvm", "sp1", "zisk"]'
      lto-args:
        description: >
          JSON object mapping a zkVM to space-separated LLVM options for this guest on it (tuning
          such as `--inline-threshold=4749`), passed to the link as `-mllvm`.
        type: string
        default: "{}"
      ere-repository:
        description: Repository of this workflow, for `sdk/`.
        type: string
        default: eth-act/ere
      ere-ref:
        description: Ref of this workflow; use the ref in `uses:`.
        type: string
        default: master
      ere-image-tag:
        description: >
          Tag of Ere's `ere-server-*` images, built from the Ere revision whose zkVM versions the
          SDKs pin.
        type: string
        default: 77e2aae
      test-stateless-validator:
        description: >
          Guest name in ere-guests' catalog (e.g. `ethrex`, `reth`); runs its `zkvm_execution`
          test on each ELF. Empty skips testing.
        type: string
        default: ""
      ere-guests-repository:
        type: string
        default: eth-act/ere-guests
      ere-guests-ref:
        type: string
        default: main
      package:
        description: Generate program VKs and upload each ELF with its VK.
        type: boolean
        default: false
      release-tag:
        description: >
          If set, attach the packaged ELFs and VKs to this existing release of the calling
          repository. The caller must grant `contents: write`.
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always
  LLVM_BIN: /usr/lib/llvm-22/bin
  LD_LLD: /usr/lib/llvm-22/bin/ld.lld

jobs:
  link:
    name: Link ${{ matrix.zkvm }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        zkvm: ${{ fromJson(inputs.zkvms) }}
    steps:
      - name: Checkout Ere
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ere-repository }}
          ref: ${{ inputs.ere-ref }}
          path: ere

      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          # llvm-22-dev: headers and CMake package for building an SDK's LLVM pass plugin.
          sudo apt-get install -y lld-22 llvm-22-dev xxd
          "$LD_LLD" --version

      - name: Install the pinned nightly
        run: rustup toolchain install nightly-2026-03-17 --profile minimal --component rust-src

      - name: Cache SDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ere/sdk/target
          key: sdk-${{ matrix.zkvm }}-${{ hashFiles('ere/sdk/**/Cargo.lock', 'ere/sdk/*.sh', 'ere/sdk/targets/*', 'ere/sdk/linker/*', 'ere/sdk/plugins/**') }}

      - name: Build the SDK
        run: |
          # On failure, repeat the first errors as annotations, so they show in the run summary.
          if ! ere/sdk/build.sh ${{ matrix.zkvm }} sdk 2>&1 | tee sdk-build.log; then
            grep -m 3 -E -A 12 '^(error|Error)|error:' sdk-build.log | cut -c 1-300 | head -60 |
              awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=SDK build (${{ matrix.zkvm }})::/'
            echo
            exit 1
          fi

      - name: Download the guest object
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.guest-object }}
          path: guest-object

      - name: Link
        env:
          LTO_ARGS: ${{ fromJson(inputs.lto-args)[matrix.zkvm] }}
        run: |
          objects=(guest-object/*.a)
          [[ ${#objects[@]} == 1 && -f ${objects[0]} ]] || {
            echo "artifact ${{ inputs.guest-object }} must hold exactly one .a file" >&2
            exit 1
          }
          mkdir -p out
          read -ra lto_args <<<"$LTO_ARGS"
          ere/sdk/link.sh sdk "${objects[0]}" "out/${{ inputs.name }}-${{ matrix.zkvm }}.elf" \
            ${lto_args[@]+"${lto_args[@]}"}
          ls -l out

      - name: Upload the ELF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ matrix.zkvm }}-elf
          path: out/${{ inputs.name }}-${{ matrix.zkvm }}.elf

  test:
    name: Test ${{ matrix.zkvm }}
    needs: link
    if: inputs.test-stateless-validator != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zkvm: ${{ fromJson(inputs.zkvms) }}
    steps:
      - name: Checkout ere-guests
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ere-guests-repository }}
          ref: ${{ inputs.ere-guests-ref }}

      # The tests run the ELF through Ere's server images, so they use the Ere revision the SDKs
      # come from rather than the one ere-guests pins.
      - name: Checkout Ere
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ere-repository }}
          ref: ${{ inputs.ere-ref }}
          path: .ere

      - name: Free up disk space
        if: matrix.zkvm == 'zisk' && hashFiles('.github/scripts/free-up-disk-space.sh') != ''
        run: bash .github/scripts/free-up-disk-space.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download the ELF
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ matrix.zkvm }}-elf
          path: elf

      - name: Test zkVM execution
        env:
          STATELESS_VALIDATOR: ${{ inputs.test-stateless-validator }}
          ZKVM: ${{ matrix.zkvm }}
          GUEST_ELF: ${{ github.workspace }}/elf/${{ inputs.name }}-${{ matrix.zkvm }}.elf
          ERE_IMAGE_REGISTRY: ghcr.io/eth-act/ere
          ERE_IMAGE_TAG: ${{ inputs.ere-image-tag }}
        run: |
          cargo test --release --package stateless-validator-test --test zkvm_execution \
            --config "patch.'https://github.com/eth-act/ere'.ere-dockerized.path='.ere/crates/dockerized'" \
            --config "patch.'https://github.com/eth-act/ere'.ere-catalog.path='.ere/crates/catalog'" \
            -- --test-threads=1

  package:
    name: Package ${{ matrix.zkvm }}
    needs: [link, test]
    if: >
      always() && inputs.package && needs.link.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zkvm: ${{ fromJson(inputs.zkvms) }}
    steps:
      - name: Download the ELF
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ matrix.zkvm }}-elf
          path: out

      - name: Generate the program VK
        run: |
          docker run --rm -e RUST_LOG=info -v "$PWD/out:/out" \
            ghcr.io/eth-act/ere/ere-server-${{ matrix.zkvm }}:${{ inputs.ere-image-tag }} \
            --elf-path /out/${{ inputs.name }}-${{ matrix.zkvm }}.elf \
            keygen --program-vk-path /out/${{ inputs.name }}-${{ matrix.zkvm }}.vk
          sha256sum out/*

      - name: Upload the ELF and VK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ matrix.zkvm }}
          path: out/${{ inputs.name }}-${{ matrix.zkvm }}.*

      - name: Attach to release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ inputs.release-tag }}" out/${{ inputs.name }}-${{ matrix.zkvm }}.*
          --repo "${{ github.repository }}" --clobber
