# Builds the zkVM SDKs (`sdk/build.sh`) and publishes them as release assets, with the link tools
# guest CI needs, so guest workflows download them instead of compiling vendor code.
#
# Push a tag `sdk-*` (for example `sdk-dev-1`). The release carries, per zkVM, `sdk-<zkvm>.tar.gz`
# (`libzkvm.a`, `zkvm.ld`, and if any `zkvm.features` and `zkvm-lto-plugin.so`, the plugin built
# for Linux x86_64 against LLVM 22), plus `ere-link-tools.tar.gz` (`link.sh`, `abi.txt`, the
# generic guest target spec and `rust-toolchain`, the pinned nightly), and `SHA256SUMS`.
name: Release SDKs

on:
  push:
    tags: ["sdk-*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.zkvm }} SDK
    runs-on: ubuntu-latest
    # A clean image with LLVM 22 only. On the runner image, `bindgen` in the vendor build scripts
    # picks up the preinstalled `clang-18` to detect include paths and then fails to parse
    # `zkvm_accelerators.h` (`unknown type name 'uint8_t'`). Pinning both `CLANG_PATH` and
    # `LIBCLANG_PATH` to LLVM 22 also works; pinning `LIBCLANG_PATH` alone does not.
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        zkvm: [openvm, sp1, zisk]
    steps:
      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl wget gnupg lsb-release software-properties-common xxd cmake \
            git build-essential ca-certificates
          wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- 22
          apt-get install -y -qq lld-22 llvm-22-dev
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" toolchain install nightly-2026-03-17 --profile minimal \
            --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Build the SDK
        env:
          LLVM_BIN: /usr/lib/llvm-22/bin
        run: |
          sdk/build.sh ${{ matrix.zkvm }} "out/sdk-${{ matrix.zkvm }}"
          tar -czf "sdk-${{ matrix.zkvm }}.tar.gz" -C out "sdk-${{ matrix.zkvm }}"
          tar -tzvf "sdk-${{ matrix.zkvm }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.zkvm }}
          path: sdk-${{ matrix.zkvm }}.tar.gz

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package the link tools
        run: |
          mkdir -p tools/ere-link-tools
          cp sdk/link.sh sdk/abi.txt crates/compiler/sdk/src/rust_rv64ima/riscv64ima-unknown-zkvm-elf.json \
            tools/ere-link-tools/
          # The nightly `sdk/build.sh` pins; guest objects must come from it (or an older LLVM).
          # shellcheck disable=SC2016
          sed -n 's/^RUST_TOOLCHAIN=\${RUST_TOOLCHAIN:-\(.*\)}$/\1/p' sdk/build.sh > tools/ere-link-tools/rust-toolchain
          test -s tools/ere-link-tools/rust-toolchain
          tar -czf dist/ere-link-tools.tar.gz -C tools ere-link-tools
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}"
          --notes "zkVM SDKs and link tools built from ${{ github.sha }}."
