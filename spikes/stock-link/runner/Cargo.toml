[package]
name = "stock-link-runner"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
hex = "0.4"
sha2 = "0.10.9"
sha3 = "0.10.8"

# OpenVM, same revisions as the ere workspace
ere-verifier-openvm = { path = "../../../crates/verifier/openvm", optional = true }
openvm-circuit = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview", default-features = false, optional = true }
openvm-sdk = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview", default-features = false, features = ["rvr"], optional = true }
openvm-sdk-config = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview", default-features = false, optional = true }
openvm-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/v2.1.0-preview", default-features = false, optional = true }

# ZisK, same versions as the ere workspace
zisk-transpiler-riscv = { version = "1.2.0-alpha", optional = true }
ziskemu = { version = "1.2.0-alpha", optional = true }

[features]
openvm = ["dep:ere-verifier-openvm", "dep:openvm-circuit", "dep:openvm-sdk", "dep:openvm-sdk-config", "dep:openvm-transpiler"]
zisk = ["dep:zisk-transpiler-riscv", "dep:ziskemu"]
