[package]
name = "ere-platform-zisk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# ZisK dependencies
ziskos.workspace = true
zisk-zkvm-interface = { workspace = true, optional = true }

# Local dependencies
ere-platform-core.workspace = true

[features]
default = ["user-hints", "inputcpy"]
user-hints = ["ziskos/user-hints"]
inputcpy = ["ziskos/inputcpy"]
zisk-custom-alloc = ["ziskos/zisk-custom-alloc"]
zisk-embedded-alloc = ["ziskos/zisk-embedded-alloc"]
zisk-embedded-dlmalloc-alloc = ["ziskos/zisk-embedded-dlmalloc-alloc"]
zisk-embedded-talc-alloc = ["ziskos/zisk-embedded-talc-alloc"]
zisk-embedded-tlfs-alloc = ["ziskos/zisk-embedded-tlfs-alloc"]
# NOTE: This enables `cycle_scope_*` to emit profile syscalls, the generated ELF can NOT be proved by ASM prover.
cycle-scope = []
# The zkvm-standards C ABI for a staticlib (`staticlib/build.sh`): `ziskos`'s `staticlib` mode,
# which gives it a private heap and leaves the C ABI to this crate, which exports it with each
# function rewinding that heap. Without `user-hints`, which pulls in tokio for the host prover.
c-abi = ["inputcpy", "ziskos/staticlib", "dep:zisk-zkvm-interface"]

[lints]
workspace = true
