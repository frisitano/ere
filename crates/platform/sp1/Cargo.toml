[package]
name = "ere-platform-sp1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# SP1 dependencies
sp1-zkvm = { workspace = true, features = ["lib"] }
sp1-libzkevm.workspace = true

# Local dependencies
ere-platform-core.workspace = true

[features]
default = ["exports", "lib", "libm"]
blake3 = ["sp1-zkvm/blake3"]
lib = ["sp1-zkvm/lib"]
libm = ["sp1-zkvm/libm"]
verify = ["sp1-zkvm/verify"]
untrusted_programs = ["sp1-zkvm/untrusted_programs"]
# `libzkevm`'s own exports of the zkvm-standards C ABI's accelerators.
exports = ["sp1-libzkevm/exports"]
# The zkvm-standards C ABI for a staticlib (`staticlib/build.sh`), with `libzkevm`'s accelerators
# wrapped to free what each allocates. Without `exports`, which would define them twice.
c-abi = []

[lints]
workspace = true
