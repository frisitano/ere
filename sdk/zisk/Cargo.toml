[package]
name = "zkvm-zisk"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
# `user-hints` pulls in tokio for the host prover; the guest side needs none of it. `staticlib`
# gives `ziskos` a private heap, apart from the guest's.
ziskos = { version = "1.3.0-alpha", default-features = false, features = ["inputcpy", "staticlib"] }
zisk-zkvm-interface = "1.3.0-alpha"

[profile.release]
codegen-units = 1
lto = "off"
panic = "abort"
