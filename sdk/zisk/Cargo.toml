[package]
name = "zkvm-zisk"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
# `user-hints` pulls in tokio for the host prover; the guest side needs none of it.
ziskos = { version = "1.3.0-alpha", default-features = false, features = ["inputcpy"] }

[profile.release]
codegen-units = 1
lto = "off"
panic = "abort"
